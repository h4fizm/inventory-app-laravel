services:
    app:
        platform: linux/amd64
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            - db
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www
        command: >
            sh -c "
              php artisan key:generate &&
              php artisan migrate --seed --force &&
              php-fpm
            "
        volumes:
            - .:/var/www
            - vendor_data:/var/www/vendor
        networks:
            - laravel

    webserver:
        image: nginx:alpine
        platform: linux/amd64
        depends_on:
            - app
        container_name: laravel_webserver
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel

    db:
        image: mysql:8.0
        platform: linux/amd64
        container_name: laravel_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: "" # root tanpa password
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: db_inventory
        ports:
            - "3307:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - laravel

networks:
    laravel:

volumes:
    db_data:
    vendor_data:
